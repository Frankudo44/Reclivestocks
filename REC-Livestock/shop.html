<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop Farm Products | REC Livestock &amp; Agro Farms</title>
  <meta name="description" content="Shop poultry, eggs, livestock, fish and farm supplies from REC Livestock & Agro Farms. Quality farm products delivered across Nigeria."/>
  <link rel="canonical" href="https://reclivestock.ng/shop.html"/>
  <link rel="icon" href="assets/logo/rec-logo.jpg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/layout.css"/>
  <link rel="stylesheet" href="css/shop.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="page-hero" aria-label="Shop">
      <div class="container">
        <div class="inner">
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="index.html">Home</a><span class="sep">/</span><span aria-current="page">Shop</span>
          </nav>
          <h1>Farm Shop</h1>
          <p>Fresh, healthy farm products from REC Livestock &amp; Agro Farms — ready for delivery across Nigeria.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="shop-layout">
          <!-- Sidebar filters -->
          <aside class="shop-sidebar" aria-label="Filters">
            <!-- Category -->
            <div class="filter-group">
              <h4>Categories</h4>
              <div id="filter_categories"></div>
            </div>

            <!-- Price -->
            <div class="filter-group">
              <h4>Maximum Price</h4>
              <div class="range-row">
                <input type="range" id="price_max" min="0" max="200000" step="500" value="0"/>
              </div>
              <div style="margin-top:.4rem;font-size:.82rem;font-weight:700;color:var(--rec-green)" id="price_max_label">Any</div>
            </div>

            <!-- Availability -->
            <div class="filter-group">
              <h4>Availability</h4>
              <ul>
                <li><label class="f-check"><input type="checkbox" id="availability_in"/> In stock only</label></li>
                <li><label class="f-check"><input type="checkbox" id="availability_out"/> Show out of stock</label></li>
              </ul>
            </div>

            <!-- Featured -->
            <div class="filter-group">
              <h4>Special</h4>
              <ul>
                <li><label class="f-check"><input type="checkbox" id="only_featured"/> Featured products</label></li>
              </ul>
            </div>

            <button type="button" class="btn-link filter-reset" id="filter_reset">Clear all filters</button>
          </aside>

          <!-- Main -->
          <div>
            <div class="shop-toolbar">
              <form id="shop_search_form" style="flex:1;max-width:360px">
                <div class="field" style="margin-bottom:0">
                  <label class="sr-only" for="shop_search">Search products</label>
                  <input class="input" type="search" id="shop_search" placeholder="Search products..."/>
                </div>
              </form>
              <div class="controls">
                <select class="sort-select" id="sort_select" aria-label="Sort products">
                  <option value="newest">Featured first</option>
                  <option value="price-asc">Price: Low to High</option>
                  <option value="price-desc">Price: High to Low</option>
                  <option value="name-asc">Name: A to Z</option>
                </select>
              </div>
            </div>

            <button class="btn btn-primary shop-filters-btn" id="shop_filters_btn" type="button">
              <svg aria-hidden="true" width="18" height="18"><use href="assets/icons/sprite.svg#i-layers"></use></svg>
              Filters
            </button>

            <p class="results" style="margin:0 0 1rem" id="results_count_label">
              <span id="results_count">0</span> products
            </p>
            <div id="shop_grid" class="shop-grid"></div>
            <div class="text-center" style="margin-top:2rem">
              <button type="button" class="btn btn-outline" id="load_more" style="display:none">Load More</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <div class="mobile-menu" id="mobile-menu" aria-hidden="true"></div>

  <!-- Mobile filters drawer -->
  <div class="filters-drawer" id="filters_drawer" aria-hidden="true">
    <div class="fd-backdrop" id="fd_backdrop"></div>
    <div class="fd-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <h3 style="font-size:1.2rem">Filters</h3>
        <button type="button" class="mm-close" id="fd_close" aria-label="Close filters">
          <svg aria-hidden="true" style="width:20px;height:20px"><use href="assets/icons/sprite.svg#i-close"></use></svg>
        </button>
      </div>
      <div id="filter_categories_mobile"></div>
      <!-- The mobile drawer reuses sidebar markup; simple approach: clone filters -->
      <div class="filter-group">
        <h4>Maximum Price</h4>
        <input type="range" id="price_max_m" min="0" max="200000" step="500" value="0"/>
      </div>
      <div class="filter-group">
        <h4>Availability</h4>
        <ul>
          <li><label class="f-check"><input type="checkbox" id="availability_in_m"/> In stock only</label></li>
          <li><label class="f-check"><input type="checkbox" id="availability_out_m"/> Show out of stock</label></li>
        </ul>
      </div>
      <button type="button" class="btn btn-primary btn-block" style="margin-top:1rem" id="fd_apply">Apply Filters</button>
    </div>
  </div>

  <a class="wa-float" id="wa-float" href="#" target="_blank" rel="noopener" aria-label="Chat with REC on WhatsApp">
    <svg aria-hidden="true"><use href="assets/icons/sprite.svg#i-whatsapp"></use></svg>
  </a>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
